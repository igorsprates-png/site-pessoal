<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Landing Page Pessoal</title>
    <style>
        /* Estilos do Cabeçalho  */
        .header {
            background: linear-gradient(135deg, #000000 0%, #1a001a 50%, #000000 100%);
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 5px solid #614C81;
            box-shadow: 0 0 25px #BDB0CA;
            position: relative;
            overflow: hidden;
        }

        .subtitulo-tech {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.3rem;
            color: #00ffff;
            text-shadow: 0 0 8px #00ffff;
            margin-top: 10px;
            font-weight: bold;
        }

    </style>
</head>
<body bgcolor="#A66DDB" text="white" style="margin: 0; padding: 0; font-family: sans-serif;">


    <!-- CABEÇALHO -->
    <header class="header">
        <h1>IGOR DA SILVA</h1>
        <p class="subtitulo-tech">&lt; UM POUCO SOBRE MIM > </p>
    </header>

    <!-- CONTEÚDO DO SITE -->
    <main style="max-width: 800px; margin: 30px auto; padding: 0 20px;">

        <!-- Secção 1: Hobbies -->
        <h2 class="Hobbies e Interesses">&lt; Hobbies e interesses</h2>
        <ul>
            <li>Jogar videogame </li>
            <li>Ouvir música e jogar futebol</li>
        </ul>
        <p align="center">
            <img src="futebolhobbie.avif" alt="Imagem dos Hobbies" width="500" style="border: 3px solid #00ffff; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.5);">
            <img src="videogamehobbie.avif" alt="Imagem dos Hobbies" width="500" style="border: 3px solid #00ffff; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.5);">
        </p>


        <hr size="2" color="white" style="margin: 30px 0;">

        <!-- Secção 2: Tecnologias -->
        <h2>Tecnologias para Aprender</h2>
        <ul>
            <li>HTML5</li>
            <li>JavaScript</li>
            <li>Python e Git/GitHub</li>
        </ul>
        <p align="center">
            <img src="tecnoaprender.jpg" alt="Imagem de Tecnologias" width="500" style="border: 3px solid #00ffff; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.5);">
        </p>

        <hr size="2" color="white" style="margin: 30px 0;">

        <!-- Secção 3: Objetivo -->
        <h2>Objetivo de Futuro</h2>
        <p>Trabalhar na aréa de esportes.</p>
        <p align="center">
            <img src="Metas-e-Objetivos.jpg" alt="Imagem do Objetivo" width="500" style="border: 3px solid #00ffff; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.5);">
        </p>

    </main>

</body>
</html>
